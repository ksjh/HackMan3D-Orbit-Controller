[platformio]
src_dir = Firmware/Hackman3D_Orbit_Controller

[env:navcore3d]
platform = atmelavr
board = sparkfun_promicro16
framework = arduino

; --- MCU / clock (already correct for promicro16, listed for clarity) ---
board_build.mcu = atmega32u4
board_build.f_cpu = 16000000L

; --- Upload settings ---
upload_protocol = avr109
upload_speed = 57600
board_upload.maximum_size = 28672
board_upload.maximum_data_size = 2560
board_upload.use_1200bps_touch = true
board_upload.wait_for_upload_port = true

; --- Bootloader (fuses / Caterina image) ---
board_bootloader.low_fuses = 0xFF
board_bootloader.high_fuses = 0xD8
board_bootloader.extended_fuses = 0xCB
board_bootloader.file = caterina/Caterina-Leonardo.hex
board_bootloader.unlock_bits = 0x3F
board_bootloader.lock_bits = 0x2F

; --- Custom USB VID/PID + strings ---
build_flags =
    -DUSB_VID=0x256F
    -DUSB_PID=0xC631
    -DUSB_MANUFACTURER='"NavCore"'
    -DUSB_PRODUCT='"3D Controller"'
